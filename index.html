<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <h1>Calculator</h1>
    <p>1 + 2</p>
    <div class="buttons">
        <div class="numbers">
            <div class="column1">
                <button>1</button>
                <button>2</button>
                <button>3</button>
            </div>
            <div class="column2">
                <button>4</button>
                <button>5</button>
                <button>6</button>
            </div>
            <div class="column3">
                <button>7</button>
                <button>8</button>
                <button>9</button>
            </div>
            <div class="column4">
                <button>0</button>
            </div>
        </div>
        <div class="operators">
            <button>+</button>
            <button>-</button>
            <button>*</button>
            <button>/</button>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
